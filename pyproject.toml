[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-audit"
version = "0.1.4"
description = "A local CLI for analyzing Claude Code, Antigravity, and coding-agent session transcripts to measure context reuse, context growth, cumulative token usage, and estimated input cost."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = [
    "claude-code",
    "antigravity",
    "antigravity-ide",
    "coding-agents",
    "token-usage",
    "prompt-caching",
    "transcript-analysis",
    "context-reuse",
    "llm-tokens",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0.0",
    "tiktoken>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/ishwar170695/context-audit"
Documentation = "https://github.com/ishwar170695/context-audit#readme"
Repository = "https://github.com/ishwar170695/context-audit.git"
Issues = "https://github.com/ishwar170695/context-audit/issues"
Changelog = "https://github.com/ishwar170695/context-audit/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
context-audit = "context_audit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["context_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

